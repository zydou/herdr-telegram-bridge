[package]
name = "htb"
version = "1.1.0"
edition = "2024"
# 1.89 = std::fs::File::try_lock
rust-version = "1.89"
license = "MIT"
description = "Watch your herdr agents from Telegram: a read-only stream of what every claude pane is thinking, doing and saying."

[[bin]]
name = "htb"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["json", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
